<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手机号登录</title>
    <style>
        :root { --primary:#4f6ef7; --primary-dark:#3d58d8; --danger:#dc2626; --text:#1f2937; --muted:#7c8894; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 18px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
            background: #f6f8fc;
            color: var(--text);
            line-height: 1.6;
        }
        .card { background:#fff; border:1px solid #e8edf5; border-radius:14px; padding:18px; margin-bottom:16px; }
        h1 { margin:0 0 6px; font-size:20px; }
        h2 { margin:0 0 12px; font-size:16px; }
        label { display:block; margin-bottom:6px; font-size:13px; font-weight:600; color:#55606e; }
        input[type="text"] { width:100%; padding:9px 11px; border:1px solid #dbe2ec; border-radius:8px; margin-bottom:10px; font-size:14px; }
        input:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 3px rgba(79,110,247,0.14); }
        .btn { display:inline-flex; align-items:center; justify-content:center; padding:9px 15px; background:var(--primary); color:#fff; border:none; border-radius:8px; cursor:pointer; font-size:14px; font-weight:600; }
        .btn:hover { background:var(--primary-dark); }
        .hint { color:var(--muted); font-size:13px; margin-top:6px; }
    </style>
</head>
<body>
{% block content %}{% endblock %}
</body>
</html>
