<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7MA出行 - 处理结果</title>
    <style>
        * { box-sizing: border-box; }
        :root { --primary: #4f6ef7; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: radial-gradient(circle at 15% 15%, #2c3c68, #151c2f 50%, #0e1424);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
        }
        .container {
            width: 420px;
            max-width: 100%;
            padding: 32px 30px 26px;
            background: rgba(255,255,255,0.98);
            border-radius: 18px;
            box-shadow: 0 22px 60px rgba(0,0,0,0.35);
            text-align: center;
        }
        h2 { margin: 0 0 18px; color: #1f2937; font-size: 22px; }
        p { color: #4b5563; font-size: 15px; margin: 0 0 12px; line-height: 1.6; }
        a.btn {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 22px;
            background: linear-gradient(135deg, #4f6ef7, #6a5bf3);
            color: #fff;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 14px;
            box-shadow: 0 10px 20px rgba(79,110,247,0.3);
        }
        a.btn:hover { opacity: 0.92; }
    </style>
</head>
<body>
    <div class="container">
        <h2>订单处理结果</h2>
        {% if data %}
        <p>{{ data.message }}</p>
        {% if data.unlock_result %}
        <p>{{ data.unlock_result }}</p>
        {% endif %}
        {% if data.return_result %}
        <p>{{ data.return_result }}</p>
        {% endif %}
        {% endif %}
        <a href="/" class="btn">返回</a>
    </div>
</body>
</html>
